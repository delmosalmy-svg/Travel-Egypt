```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Successful - Travel Egypt</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 35, 65, 0.25), rgba(0, 35, 65, 0.35)),
                url("https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=2000&q=90");
            background-size: cover;
            background-position: center;
        }

        nav {
            margin: 15px 2%;
            padding: 22px;
            background: #082d4b;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav h2 {
            color: #eeb94e;
            font-size: 27px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .success-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .success-card {
            background: rgba(255, 250, 240, 0.96);
            width: 650px;
            max-width: 100%;
            padding: 65px 35px;
            text-align: center;
            border-radius: 35px;
            border: 3px solid #e7b84e;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .check {
            width: 110px;
            height: 110px;
            background: #39a85a;
            color: white;
            border-radius: 50%;
            font-size: 75px;
            line-height: 110px;
            margin: -115px auto 35px;
            border: 7px solid white;
        }

        .success-card h1 {
            color: #082d4b;
            font-size: 35px;
            margin-bottom: 25px;
        }

        .success-card h2 {
            color: #082d4b;
            margin-bottom: 18px;
        }

        .success-card p {
            color: #333;
            font-size: 21px;
            margin-bottom: 35px;
        }

        .home-btn {
            display: inline-block;
            background: #082d4b;
            color: white;
            padding: 17px 40px;
            border-radius: 35px;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #dba936;
            color: #082d4b;
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .success-card h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>✈ Travel Egypt</h2>
        <div>
            <a href="/">Home</a>
            <a href="/#destinations">Destinations</a>
            <a href="/#booking">Book Now</a>
            <a href="/bookings">View Bookings</a>
        </div>
    </nav>

    <div class="success-container">

        <div class="success-card">

            <div class="check">✓</div>

            <h1>Booking Saved Successfully!</h1>

            <h2>Thank You {{ name }}!</h2>

            <p>Your booking has been saved successfully.</p>

            <a href="/" class="home-btn">⌂ Back to Home</a>

        </div>

    </div>

</body>
</html>
